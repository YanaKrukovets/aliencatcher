<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 42 48" width="60" height="80">
  <!-- Antennas -->
  <path d="M11 8 Q7 2 7 0" stroke="#7CFC00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M19 8 Q23 2 23 0" stroke="#7CFC00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Antenna tips -->
  <circle cx="7" cy="0" r="2.5" fill="#FFD700"/>
  <circle cx="23" cy="0" r="2.5" fill="#FFD700"/>

  <!-- Head -->
  <ellipse cx="15" cy="12" rx="10" ry="11" fill="#7CFC00"/>
  <!-- Head shine -->
  <ellipse cx="13" cy="10" rx="4" ry="5" fill="white" fill-opacity="0.3"/>

  <!-- Eye whites -->
  <ellipse cx="11" cy="12" rx="3.5" ry="4" fill="white"/>
  <ellipse cx="19" cy="12" rx="3.5" ry="4" fill="white"/>
  <!-- Pupils -->
  <circle cx="11" cy="13" r="2" fill="black"/>
  <circle cx="19" cy="13" r="2" fill="black"/>
  <!-- Eye highlights -->
  <circle cx="12" cy="12" r="1" fill="white"/>
  <circle cx="20" cy="12" r="1" fill="white"/>

  <!-- Smile -->
  <path d="M18.9 15.8 A4 4 0 0 1 11.1 15.8" stroke="black" stroke-width="1.5" fill="none"/>

  <!-- Body -->
  <rect x="8" y="20" width="14" height="10" rx="3" fill="#6BEB00"/>

  <!-- Arms -->
  <line x1="8" y1="22" x2="4" y2="25" stroke="#7CFC00" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="26" y2="25" stroke="#7CFC00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="4" cy="25" r="2" fill="#7CFC00"/>
  <circle cx="26" cy="25" r="2" fill="#7CFC00"/>

  <!-- Legs -->
  <line x1="12" y1="30" x2="11" y2="35" stroke="#7CFC00" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="30" x2="19" y2="35" stroke="#7CFC00" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="11" cy="35" rx="2.5" ry="1.5" fill="#7CFC00"/>
  <ellipse cx="19" cy="35" rx="2.5" ry="1.5" fill="#7CFC00"/>
</svg>
